name: Update GitHub Activity Stats

on:
  schedule:
    # Todos los días a las 03:00 UTC (00:00 en Argentina)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generar estadísticas
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/generate-github-stats.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/github-activity.svg
          if git diff --staged --quiet; then
            echo "Sin cambios en las estadísticas."
          else
            git commit -m "chore: actualizar estadísticas de GitHub [skip ci]"
            git push
          fi
